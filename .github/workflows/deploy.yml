name: Deploy

# Deploys main to the self-hosted server once CI has passed on it: every push to main, which includes
# every merged PR. Also runnable by hand (Actions → Deploy → Run workflow, on main).
# The server is reachable only inside a Tailscale tailnet, so the runner joins it first (ephemeral node),
# then ships the exact commit CI tested over SSH and rebuilds with compose.selfhost.yml.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Its own environment (not Vercel's "Production") holds the TS_* and DEPLOY_* secrets.
    environment: self-hosted
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      # The commit CI tested (workflow_run), or the tip of main (manual run).
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # Until the server is set up (no secrets yet) the run is skipped instead of failing on every push.
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$TS_OAUTH_CLIENT_ID" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "::notice title=Deploy skipped::TS_OAUTH_CLIENT_ID / DEPLOY_HOST / DEPLOY_USER / DEPLOY_PATH are not set in the self-hosted environment (see README, Tự động deploy)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          ref: ${{ env.SHA }}

      - name: Join the tailnet
        if: steps.cfg.outputs.ready == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS || 'tag:ci' }}
          ping: ${{ secrets.DEPLOY_HOST }}

      - name: Prepare SSH
        if: steps.cfg.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 20
          EOF

      - name: Upload the release
        if: steps.cfg.outputs.ready == 'true'
        run: |
          git archive --format=tar.gz HEAD |
            ssh deploy "mkdir -p '$DEPLOY_PATH' && cat > '$DEPLOY_PATH/.release.tar.gz'"

      - name: Build and restart on the server
        if: steps.cfg.outputs.ready == 'true'
        run: |
          ssh deploy "DEPLOY_PATH='$DEPLOY_PATH' SHA='$SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # Swap the code in place. Only data/ (Redis) and .env survive; refuse to wipe a directory that
          # holds anything else and is not a previous be_game deploy (wrong DEPLOY_PATH).
          others=$(find . -mindepth 1 -maxdepth 1 ! -name data ! -name .env ! -name .release.tar.gz | head -1)
          if [ -n "$others" ] && ! grep -qs '"name": "be_game"' package.json; then
            echo "$DEPLOY_PATH is not empty and not a be_game deploy, refusing to clean it" >&2
            exit 1
          fi
          find . -mindepth 1 -maxdepth 1 ! -name data ! -name .env ! -name .release.tar.gz -exec rm -rf {} +
          tar -xzf .release.tar.gz
          rm .release.tar.gz
          echo "$SHA" > REVISION
          mkdir -p data/redis

          docker compose -f compose.selfhost.yml up -d --build --remove-orphans
          # Dangling be_game images only: the host is shared, so never a global prune.
          docker image prune -f --filter label=app.be_game=true
          docker compose -f compose.selfhost.yml ps

          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:4000/api/health | grep -q '"ok":true'; then
              echo "healthy at $SHA"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed" >&2
          docker compose -f compose.selfhost.yml logs --tail 50 be_game >&2
          exit 1
          REMOTE

      # Public check once the server has a domain (e.g. through a Cloudflare Tunnel).
      - name: Public health check
        if: steps.cfg.outputs.ready == 'true' && vars.GAME_DOMAIN != ''
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://${{ vars.GAME_DOMAIN }}/api/health" | grep -q '"ok":true'; then
              echo "healthy"; exit 0
            fi
            sleep 3
          done
          echo "health check failed" >&2
          exit 1
