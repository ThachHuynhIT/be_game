name: Deploy

# Deploys main to the self-hosted server over SSH once CI has passed on main.
# Also runnable by hand (Actions → Deploy → Run workflow).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Its own environment (not Vercel's "Production") holds the DEPLOY_* secrets.
    environment: self-hosted
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      # Until the server is set up (no secrets yet) the run is skipped instead of failing on every push.
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "::notice title=Deploy skipped::DEPLOY_HOST / DEPLOY_USER / DEPLOY_PATH are not set in the self-hosted environment (see README, Tự động deploy)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare SSH
        if: steps.cfg.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Update and restart on the server
        if: steps.cfg.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git fetch --prune origin main
          git reset --hard origin/main
          docker compose up -d --build --remove-orphans
          docker image prune -f
          docker compose ps
          REMOTE

      - name: Health check
        if: steps.cfg.outputs.ready == 'true' && vars.GAME_DOMAIN != ''
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://${{ vars.GAME_DOMAIN }}/api/health" | grep -q '"ok":true'; then
              echo "healthy"; exit 0
            fi
            sleep 3
          done
          echo "health check failed" >&2
          exit 1
