name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          GAME_DOMAIN=game.example.com docker compose config --quiet
          docker compose -f compose.selfhost.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: be_game:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts and answers
        run: |
          docker run -d --name be_game -p 4000:4000 be_game:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4000/api && exit 0
            sleep 1
          done
          docker logs be_game
          exit 1
