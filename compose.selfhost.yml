# Self-hosted behind the host's Traefik + Cloudflare Tunnel (no published ports, no Caddy): be_game + Redis.
#   docker compose -f compose.selfhost.yml up -d --build      → https://${GAME_DOMAIN}
# Deployed by .github/workflows/deploy.yml. .env next to this file: GAME_DOMAIN (required), ALLOWED_ORIGIN, REDIS_URL, DATABASE_URL, SESSION_SECRET, ADMIN_USERNAMES and BE_GAME_COUNT_COMMANDS (optional).
#
# be_game joins the external `traefik_network` (Traefik routes GAME_DOMAIN to it via the labels below);
# Redis stays on the project's own network and is reachable only by be_game.
name: be_game
services:
  be_game:
    build: .
    image: be_game:local
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: "4000"
      # Set REDIS_URL in .env to the shared Upstash URL so the Vercel backup sees the same rooms; leave it unset
      # (or empty) to use the local redis service.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}
      # Ops aid: BE_GAME_COUNT_COMMANDS=1 in .env logs the Redis command count every 60 s (docs/SELF_HOSTING.md).
      BE_GAME_COUNT_COMMANDS: ${BE_GAME_COUNT_COMMANDS:-}
      # Accounts (docs/SELF_HOSTING.md). DATABASE_URL (Neon) and SESSION_SECRET are secrets: only in .env (chmod 600), never printed.
      # Without DATABASE_URL accounts live in memory (lost on restart): dev only.
      DATABASE_URL: ${DATABASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      # Commit being deployed (exported by .github/workflows/deploy.yml); /api/health reports it.
      BUILD_COMMIT: ${BUILD_COMMIT:-}
    depends_on:
      - redis
    networks:
      - default
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.be_game.rule=Host(`${GAME_DOMAIN:?set GAME_DOMAIN in .env}`)"
      - "traefik.http.routers.be_game.entrypoints=web"
      - "traefik.http.services.be_game.loadbalancer.server.port=4000"
      - "traefik.http.services.be_game.loadbalancer.healthcheck.path=/api"
      - "traefik.http.services.be_game.loadbalancer.healthcheck.interval=30s"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      # Bind mount, not a named volume: lives in the deploy directory, so host backups of /home cover it.
      - ./data/redis:/data

networks:
  default:
    name: be_game_default
  traefik_network:
    name: traefik_network
    external: true
