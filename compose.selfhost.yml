# Self-hosted on a Tailscale-only host (no public ports, no Caddy): be_game + Redis.
#   docker compose -f compose.selfhost.yml up -d --build      → http://<host>:4000
# Deployed by .github/workflows/deploy.yml. Optional .env next to this file: ALLOWED_ORIGIN.
#
# Host networking: the host firewall drops tailnet traffic to Docker-published (bridged) ports,
# but lets it reach ports on the host itself. Redis listens on loopback only.
name: be_game
services:
  be_game:
    build:
      context: .
      # Lets the deploy prune only be_game's own superseded images (never other projects' on a shared host).
      labels:
        app.be_game: "true"
    image: be_game:local
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    network_mode: host
    environment:
      PORT: "4000"
      REDIS_URL: redis://127.0.0.1:6379
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379", "--appendonly", "yes"]
    volumes:
      # Bind mount, not a named volume: lives in the deploy directory, so host backups of /home cover it.
      - ./data/redis:/data
